<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Long call payoff at expiry" font-family="Inter, sans-serif" font-size="12">
  <rect width="400" height="240" fill="none"/>
  <line x1="40" y1="160" x2="380" y2="160" stroke="#888" stroke-width="1"/>
  <line x1="40" y1="20" x2="40" y2="220" stroke="#888" stroke-width="1"/>
  <polyline points="40,180 200,180 360,40" fill="none" stroke="#2a8a99" stroke-width="3"/>
  <line x1="200" y1="160" x2="200" y2="168" stroke="#888"/>
  <text x="200" y="186" text-anchor="middle" fill="#888">Strike 100</text>
  <text x="375" y="176" text-anchor="end" fill="#888">Price at expiry</text>
  <text x="46" y="32" fill="#888">Profit / loss</text>
